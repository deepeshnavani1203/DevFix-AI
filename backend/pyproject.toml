[project]
name = "devfix-backend"
version = "0.1.0"
description = "DevFix AI - Multi-Agent AI Debugging Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "groq>=0.11.0",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.2.0",
    "mcp>=1.1.2",
    "langgraph>=0.2.40",
    "langchain-core>=0.3.0",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
